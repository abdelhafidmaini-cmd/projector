name: Build CinemaHome APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Release Keystore
        run: |
          keytool -genkeypair -v -keystore app/release.jks -alias cinemahome -keyalg RSA -keysize 2048 -validity 10000 -storepass cinemahome123 -keypass cinemahome123 -dname "CN=CinemaHome, OU=Projector, O=Home, L=Timimoun, C=DZ"

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CinemaHome-app-release
          path: app/build/outputs/apk/release/app-release.apk
